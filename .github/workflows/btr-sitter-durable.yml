name: BTR durable sitter repair

on:
  push:
    branches:
      - btr-sitter-durable-20260815
    paths:
      - .github/workflows/btr-sitter-durable.yml

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: btr-sitter-durable-20260815
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch
        run: python btr_sitter_durable_patch.py
      - name: Syntax checks
        run: |
          node --check shared-care.js
          node --check sw.js
      - name: Full regression suite
        run: npm test
      - name: Verify scope
        run: |
          git diff --check
          changed=$(git diff --name-only | sort | tr '\n' ' ')
          echo "Changed: $changed"
          test "$changed" = "index.html shared-care.js sw.js tests/regression.mjs "
      - name: Commit repaired test build
        run: |
          git config user.name "BTR Repair"
          git config user.email "actions@users.noreply.github.com"
          git add index.html shared-care.js sw.js tests/regression.mjs
          git commit -m "BTR durable sitter state repair"
          git push origin HEAD:btr-sitter-durable-20260815
