name: BTR Sitter Pass 1
on:
  push:
    branches:
      - btr-sitter-pass1-20260815
    paths:
      - .github/workflows/btr-sitter-pass1.yml
permissions:
  contents: write
jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: btr-sitter-pass1-20260815
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Pass 1
        run: python .github/pass1.py
      - name: Syntax and regression
        run: |
          node --check sitter-mode.js
          node --check shared-care.js
          npm test
      - name: Verify scope
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' index.html sitter-mode.js sw.js tests/regression.mjs | sort)"
          test "$changed" = "$expected"
      - name: Commit isolated Pass 1
        run: |
          git config user.name "BTR Sitter Pass 1"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sitter-mode.js sw.js tests/regression.mjs
          git commit -m "Reset pre-release sitter test session"
          git push origin HEAD:btr-sitter-pass1-20260815
