name: Deploy Sitter Rewrite Payload

on:
  push:
    branches:
      - deploy-sitter-rewrite-20260815
    paths:
      - .github/workflows/deploy-sitter-rewrite.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy-sitter-rewrite-20260815
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reassemble exact checkpoint payload
        run: |
          cat .rewrite-payload/chunk_00 .rewrite-payload/chunk_01_02 .rewrite-payload/chunk_03_04 .rewrite-payload/chunk_05a .rewrite-payload/chunk_05b .rewrite-payload/chunk_06 .rewrite-payload/chunk_07_08 .rewrite-payload/chunk_09_10 > /tmp/payload.b64
          test "$(wc -c < /tmp/payload.b64)" -eq 65436
          base64 -d /tmp/payload.b64 > /tmp/sitter-rewrite.tgz
          echo "f51bf552f07f57cca23bc1f447cc49f8c2be765f9ef69d19820ef57bdf73bc17  /tmp/sitter-rewrite.tgz" | sha256sum -c -
          mkdir -p /tmp/rewrite
          tar -xzf /tmp/sitter-rewrite.tgz -C /tmp/rewrite
          cp /tmp/rewrite/sitter-mode.js .
          cp /tmp/rewrite/shared-care-core.js .
          cp /tmp/rewrite/shared-care.js .
          cp /tmp/rewrite/app.js .
          cp /tmp/rewrite/index.html .
          cp /tmp/rewrite/styles.css .
          cp /tmp/rewrite/sw.js .
          cp /tmp/rewrite/tests/regression.mjs tests/regression.mjs
      - name: Verify exact file blobs
        run: |
          test "$(git hash-object sitter-mode.js)" = "882ac0f8676e06121da7f5b1dc7efbde84dd5e9b"
          test "$(git hash-object shared-care-core.js)" = "039a3b135d45bed2387609fad1bf6f32b824b231"
          test "$(git hash-object shared-care.js)" = "32591695088be2c96a988ecea4dbafcb761b9f09"
          test "$(git hash-object app.js)" = "4c0f4ac3e6febe3c86d5dfc114e55d5aa436ac61"
          test "$(git hash-object index.html)" = "f34d7a595375119b9646904f639413216e2f58e5"
          test "$(git hash-object styles.css)" = "0984dd2eb3968952d36f0c8c311f48172e6fbfd7"
          test "$(git hash-object sw.js)" = "603b38eb86542cf09010d51d801f1f95ca78423b"
          test "$(git hash-object tests/regression.mjs)" = "623876e3f94e186d14689b1885ef3ec7d74df6a7"
      - name: Syntax and regression
        run: |
          node --check app.js
          node --check shared-care-core.js
          node --check sitter-mode.js
          node --check shared-care.js
          npm test
      - name: Verify intended scope
        run: |
          git diff --check
          tracked="$(git diff --name-only | sort)"
          expected_tracked="$(printf '%s\n' app.js index.html shared-care-core.js shared-care.js styles.css sw.js tests/regression.mjs | sort)"
          untracked="$(git ls-files --others --exclude-standard | sort)"
          test "$tracked" = "$expected_tracked"
          test "$untracked" = "sitter-mode.js"
      - name: Commit exact rewrite
        run: |
          git config user.name "BTR Rewrite"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html shared-care-core.js shared-care.js sitter-mode.js styles.css sw.js tests/regression.mjs
          git commit -m "Sitter Mode rewrite v1"
          git push origin HEAD:deploy-sitter-rewrite-20260815
