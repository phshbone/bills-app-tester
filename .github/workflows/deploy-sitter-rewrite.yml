name: Deploy Sitter Rewrite Payload

on:
  push:
    branches:
      - deploy-sitter-rewrite-20260815
    paths:
      - .github/workflows/deploy-sitter-rewrite.yml

jobs:
  diagnose-sizes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy-sitter-rewrite-20260815
      - name: Report exact chunk sizes
        run: |
          wc -c .rewrite-payload/chunk_00 .rewrite-payload/chunk_01_02 .rewrite-payload/chunk_03_04 .rewrite-payload/chunk_05 .rewrite-payload/chunk_06 .rewrite-payload/chunk_07_08 .rewrite-payload/chunk_09_10
          sha256sum .rewrite-payload/chunk_05 .rewrite-payload/chunk_06
