name: Deploy Sitter Rewrite Payload

on:
  push:
    branches:
      - deploy-sitter-rewrite-20260815
    paths:
      - .github/workflows/deploy-sitter-rewrite.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy-sitter-rewrite-20260815
          fetch-depth: 0
      - name: Verify transferred chunks
        run: |
          for f in .rewrite-payload/chunk_*; do wc -c "$f"; sha256sum "$f"; done
