name: Deploy Sitter Rewrite Payload

on:
  push:
    branches:
      - deploy-sitter-rewrite-20260815
    paths:
      - .github/workflows/deploy-sitter-rewrite.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy-sitter-rewrite-20260815
      - name: Diagnose corrected payload
        run: |
          wc -c .rewrite-payload/chunk_05_06_fixed
          sha256sum .rewrite-payload/chunk_05_06_fixed
          cat .rewrite-payload/chunk_00 .rewrite-payload/chunk_01_02 .rewrite-payload/chunk_03_04 .rewrite-payload/chunk_05_06_fixed .rewrite-payload/chunk_07_08 .rewrite-payload/chunk_09_10 > /tmp/payload.b64
          python3 - <<'PY'
          import base64, pathlib, string
          p=pathlib.Path('/tmp/payload.b64').read_text()
          print('payload chars',len(p),'mod4',len(p)%4)
          allowed=set(string.ascii_letters+string.digits+'+/=')
          bad=[(i,repr(c)) for i,c in enumerate(p) if c not in allowed]
          print('bad chars',bad[:20], 'count',len(bad))
          try:
              raw=base64.b64decode(p,validate=True)
              print('decoded bytes',len(raw))
              pathlib.Path('/tmp/sitter-rewrite.tgz').write_bytes(raw)
          except Exception as e:
              print('decode error',repr(e))
              raise
          PY
          sha256sum /tmp/sitter-rewrite.tgz
