name: BTR Static Screen Header
on:
  push:
    branches:
      - btr-static-screen-header-20260815
    paths:
      - .github/workflows/btr-static-screen-header.yml
permissions:
  contents: write
jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: btr-static-screen-header-20260815
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply static screen header
        run: python .github/static-screen-header.py
      - name: Syntax and regression
        run: |
          node --check app.js
          node --check sitter-mode.js
          node --check shared-care.js
          npm test
      - name: Verify scope
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' app.js index.html styles.css sw.js tests/regression.mjs | sort)"
          printf 'Changed files:\n%s\n' "$changed"
          test "$changed" = "$expected"
          git diff -- sitter-mode.js shared-care.js shared-care-core.js worker/src/worker.js
      - name: Commit isolated static header
        run: |
          git config user.name "BTR Static Screen Header"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html styles.css sw.js tests/regression.mjs
          git commit -m "Use static compact header off Home"
          git push origin HEAD:btr-static-screen-header-20260815
