name: BTR Structural Shell
on:
  push:
    branches:
      - btr-structural-shell-20260815
    paths:
      - .github/workflows/btr-structural-shell.yml
permissions:
  contents: write
jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: btr-structural-shell-20260815
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply structural shell repair
        run: python .github/btr-structural-shell.py
      - name: Syntax and regression
        run: |
          node --check app.js
          node --check shared-care.js
          node --check sitter-mode.js
          node --check shared-care-core.js
          npm test
      - name: Verify intended scope
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' app.js index.html shared-care.js styles.css sw.js tests/regression.mjs | sort)"
          printf 'Changed files:\n%s\n' "$changed"
          test "$changed" = "$expected"
      - name: Commit isolated shell repair
        run: |
          git config user.name "BTR Structural Shell"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html shared-care.js styles.css sw.js tests/regression.mjs
          git commit -m "Structural app shell repair"
          git push origin HEAD:btr-structural-shell-20260815
