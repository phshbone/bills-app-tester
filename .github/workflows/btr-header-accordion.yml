name: BTR Header Accordion
on:
  push:
    branches:
      - btr-header-accordion-20260815
    paths:
      - .github/workflows/btr-header-accordion.yml
permissions:
  contents: write
jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: btr-header-accordion-20260815
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply accordion header
        run: python .github/header-accordion.py
      - name: Syntax and regression
        run: |
          node --check app.js
          node --check sitter-mode.js
          node --check shared-care.js
          npm test
      - name: Verify scope
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' index.html styles.css sw.js tests/regression.mjs | sort)"
          printf 'Changed files:\n%s\n' "$changed"
          test "$changed" = "$expected"
      - name: Commit isolated accordion header
        run: |
          git config user.name "BTR Header Accordion"
          git config user.email "actions@users.noreply.github.com"
          git add index.html styles.css sw.js tests/regression.mjs
          git commit -m "Add compact accordion header"
          git push origin HEAD:btr-header-accordion-20260815
